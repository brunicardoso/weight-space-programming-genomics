[workspace]
name = "wsp-genomics"
channels = ["conda-forge", "bioconda"]
platforms = [{ platform = "linux-64", cuda = "12.8" }]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "*"
scikit-learn = "*"
pyyaml = "*"
h5py = "*"
matplotlib = "*"
tqdm = "*"
requests = "*"
pytest = "*"
bedtools = "*"
pybedtools = "*"
htslib = "*"

[pypi-dependencies]
torch = { version = ">=2.7", index = "https://download.pytorch.org/whl/cu128" }
modisco-lite = "*"
memelite = "*"
pyjaspar = "*"
wspg = { path = ".", editable = true }
pyfaidx = ">=0.9.2.2, <0.10"

[tasks]
env-check = "python -m wspg.envcheck"
smoke = "python -m wspg.smoke --config configs/smoke.yaml --seed 0"
test = "pytest -q tests"
