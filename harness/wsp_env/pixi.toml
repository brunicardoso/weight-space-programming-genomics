# Minimal CPU-only environment for blind WSP sessions, installed to /opt/wsp-env.
[workspace]
name = "wsp-env"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26"
scipy = "*"

[pypi-dependencies]
torch = { version = ">=2.7", index = "https://download.pytorch.org/whl/cpu" }
